<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Commercial Services Dashboard</title>

  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    :root {
      --bg: #0f172a;
      --white: #ffffff;
      --burgundy: #7a0026;
    }

    * {
      box-sizing: border-box;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: linear-gradient(135deg, #0f172a, #1e293b);
    }

    /* ================= HEADER ================= */

    .main-header {
      padding: 20px 28px 22px;
      color: #fff;
      background: linear-gradient(90deg, #7a0026, #a00035);
      box-shadow: 0 6px 20px rgba(0, 0, 0, .35);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      gap: 14px;
    }

    /* Back Button */

    .back-link {
      text-decoration: none;
      background: #ffffff;
      color: var(--burgundy);
      font-weight: 800;
      font-size: 12px;
      padding: 7px 14px;
      border-radius: 20px;
      transition: .2s ease;
      white-space: nowrap;
      box-shadow: 0 6px 14px rgba(0, 0, 0, .22);
    }

    .back-link:hover {
      background: #f3f4f6;
      transform: translateY(-1px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, .28);
    }

    .header-top h1 {
      margin: 0;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: .4px;
      flex: 1;
      text-align: center;
    }

    .header-year {
      font-size: 13px;
      font-weight: 700;
      background: rgba(255, 255, 255, .20);
      padding: 6px 14px;
      border-radius: 20px;
      white-space: nowrap;
    }

    /* ================= NAVIGATION ================= */

    .header-tabs {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px;
    }

    .header-tab {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 6px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .3px;
      color: #fff;
      transition: .2s ease;
      box-shadow: 0 6px 16px rgba(0, 0, 0, .25);
    }

    /* Dashboard Colours */

    .tab-outpatient {
      background: linear-gradient(135deg, #0891b2, #0e7490);
    }

    .tab-inpatient {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
    }

    .tab-maternity {
      background: linear-gradient(135deg, #10b981, #059669);
    }

    .tab-radiology {
      background: linear-gradient(135deg, #9333ea, #7e22ce);
    }

    .tab-theatre {
      background: linear-gradient(135deg, #f97316, #ea580c);
    }

    .tab-insurance {
      background: linear-gradient(135deg, #7a0026, #a00035);
    }

    .header-tab:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(0, 0, 0, .4);
    }

    .header-tab.active {
      outline: 3px solid #ffffff;
      transform: scale(1.02);
    }

    /* ================= DASHBOARD ================= */

    .frame-wrap {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .aspect-ratio-box {
      width: 100%;
      max-width: 1600px;
      aspect-ratio: 16/9;
    }

    .aspect-ratio-box iframe {
      width: 100%;
      height: 100%;
      border: 0;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 18px 45px rgba(0, 0, 0, .45);
    }

    /* ====== RESPONSIVE ====== */
    @media (max-width: 1024px) {
      .header-tabs {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 768px) {
      .main-header {
        padding: 12px 16px;
      }

      .header-top {
        flex-wrap: wrap;
        justify-content: center;
      }

      .header-top h1 {
        font-size: 16px;
        flex: 0 0 100%;
        text-align: center;
        order: -1;
      }

      .header-tabs {
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
      }

      .header-tab {
        font-size: 11px;
        padding: 8px 4px;
      }

      .frame-wrap {
        padding: 10px;
      }

      .aspect-ratio-box {
        aspect-ratio: 4/3;
      }
    }

    @media (max-width: 480px) {
      .header-tabs {
        grid-template-columns: repeat(2, 1fr);
        gap: 4px;
      }

      .header-tab {
        font-size: 10px;
        padding: 6px 4px;
      }

      .back-link {
        font-size: 10px;
        padding: 5px 10px;
      }

      .header-year {
        font-size: 11px;
        padding: 4px 10px;
      }
    }
  </style>
</head>

<body>

  <header class="main-header">

    <div class="header-top">

      <a class="back-link" href="../../index.html">
        ← Master Dashboard
      </a>

      <h1>Commercial Services Dashboard</h1>

      <span class="header-year">
        FY2026
      </span>

    </div>

    <div class="header-tabs">

      <div class="header-tab tab-outpatient active"
      data-src="./Workload_Dashboard.html">
      <i class="fas fa-hospital-user"></i> Outpatient
    </div>

    <div class="header-tab tab-inpatient"
    data-src="./Inpatient_Dashboard.html">
    <i class="fas fa-procedures"></i> Inpatient
  </div>

  <div class="header-tab tab-maternity"
  data-src="./Maternity_Dashboard.html">
  <i class="fas fa-baby"></i> Maternity
</div>

<div class="header-tab tab-radiology"
data-src="./Radiology_Dashboard.html">
<i class="fas fa-x-ray"></i> Radiology
</div>

<div class="header-tab tab-theatre"
data-src="./Theatre_Dashboard.html">
<i class="fas fa-syringe"></i> Theatre
</div>

<div class="header-tab tab-insurance"
data-src="./Insurance_Dashboard.html">
<i class="fas fa-shield-alt"></i> Insurance
</div>

</div>

</header>

<main class="frame-wrap">

  <div class="aspect-ratio-box">

    <iframe id="frame"
    src="./Outpatient_Dashboard.html">
  </iframe>

</div>

</main>

<script>

  const frame = document.getElementById("frame");
  const tabs = document.querySelectorAll(".header-tab");

  tabs.forEach(tab => {

    tab.addEventListener("click", () => {

      tabs.forEach(t => t.classList.remove("active"));

      tab.classList.add("active");

      frame.src = tab.dataset.src;

    });

  });

</script>

</body>
</html>
