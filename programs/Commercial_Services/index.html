<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Commercial Services Dashboard</title>

<style>
:root{
  --bg:#0f172a;
  --white:#ffffff;
  --burgundy:#7a0026;
}

*{
  box-sizing:border-box;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
}

body{
  margin:0;
  height:100vh;
  display:flex;
  flex-direction:column;
  background:linear-gradient(135deg,#0f172a,#1e293b);
}

/* ================= HEADER ================= */

.main-header{
  padding:20px 28px 22px;
  color:#fff;
  background:linear-gradient(90deg,#7a0026,#a00035);
  box-shadow:0 6px 20px rgba(0,0,0,.35);
}

.header-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:16px;
  gap:14px;
}

/* Back Button */

.back-link{
  text-decoration:none;
  background:#ffffff;
  color:var(--burgundy);
  font-weight:800;
  font-size:12px;
  padding:7px 14px;
  border-radius:20px;
  transition:.2s ease;
  white-space:nowrap;
  box-shadow:0 6px 14px rgba(0,0,0,.22);
}

.back-link:hover{
  background:#f3f4f6;
  transform:translateY(-1px);
  box-shadow:0 10px 20px rgba(0,0,0,.28);
}

.header-top h1{
  margin:0;
  font-size:22px;
  font-weight:800;
  letter-spacing:.4px;
  flex:1;
  text-align:center;
}

.header-year{
  font-size:13px;
  font-weight:700;
  background:rgba(255,255,255,.20);
  padding:6px 14px;
  border-radius:20px;
  white-space:nowrap;
}

/* ================= NAVIGATION ================= */

.header-tabs{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
}

.header-tab{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  padding:10px 6px;
  border-radius:12px;
  cursor:pointer;
  font-size:13px;
  font-weight:700;
  letter-spacing:.3px;
  color:#fff;
  transition:.2s ease;
  box-shadow:0 6px 16px rgba(0,0,0,.25);
}

/* Dashboard Colours */

.tab-inpatient{
    background:linear-gradient(135deg,#2563eb,#1d4ed8);
}

.tab-radiology{
    background:linear-gradient(135deg,#9333ea,#7e22ce);
}

.tab-maternity{
    background:linear-gradient(135deg,#10b981,#059669);
}

.tab-theatre{
    background:linear-gradient(135deg,#f97316,#ea580c);
}

.tab-workload{
    background:linear-gradient(135deg,#dc2626,#b91c1c);
}

.header-tab:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 24px rgba(0,0,0,.4);
}

.header-tab.active{
  outline:3px solid #ffffff;
  transform:scale(1.02);
}

/* ================= DASHBOARD ================= */

.frame-wrap{
  flex:1;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.aspect-ratio-box{
  width:100%;
  max-width:1600px;
  aspect-ratio:16/9;
}

.aspect-ratio-box iframe{
  width:100%;
  height:100%;
  border:0;
  border-radius:18px;
  background:#fff;
  box-shadow:0 18px 45px rgba(0,0,0,.45);
}
</style>
</head>

<body>

<header class="main-header">

<div class="header-top">

<a class="back-link" href="../../index.html">
← Master Dashboard
</a>

<h1>Commercial Services Dashboard</h1>

<span class="header-year">
FY2026
</span>

</div>

<div class="header-tabs">

<div class="header-tab tab-inpatient active"
     data-src="./Inpatient_Dashboard.html">
💳 Inpatient
</div>

<div class="header-tab tab-radiology"
     data-src="./Radiology_Dashboard.html">
🩻 Radiology
</div>

<div class="header-tab tab-maternity"
     data-src="./Maternity_Dashboard.html">
🤱 Maternity
</div>

<div class="header-tab tab-theatre"
     data-src="./Theatre_Dashboard.html">
🏥 Theatre
</div>

<div class="header-tab tab-workload"
     data-src="./Workload_Dashboard.html">
📊 OPD Workload
</div>

</div>

</header>

<main class="frame-wrap">

<div class="aspect-ratio-box">

<iframe id="frame"
        src="./Inpatient_Dashboard.html">
</iframe>

</div>

</main>

<script>

const frame = document.getElementById("frame");
const tabs = document.querySelectorAll(".header-tab");

tabs.forEach(tab => {

    tab.addEventListener("click", () => {

        tabs.forEach(t => t.classList.remove("active"));

        tab.classList.add("active");

        frame.src = tab.dataset.src;

    });

});

</script>

</body>
</html>
